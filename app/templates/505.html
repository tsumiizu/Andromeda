{% extends 'base.html' %}
{% load static %}
{% block content %}

<section id="home" class="hero-section erro404-section">
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="hero-inner erro404-inner">

    <!-- ── Personagem com a placa ── -->
    <div class="erro404-character fade-in">
      <img
        src="{% static 'media/sylviechan.webp' %}"
        alt="Personagem Andromeda segurando uma placa"
        class="erro404-img"
      >
      <!-- O número fica ancorado na placa -->
      <span class="erro404-code">505</span>
    </div>

    <!-- ── Texto e botões (reaproveitando o hero) ── -->
    <div class="hero-content fade-in fade-in-delay-1 erro404-content">
      <div class="hero-tag">Erro na requisição</div>
      <div class="hero-sub">Ops…</div>
      <p class="hero-text">
        Faremos o possível para que sua conexão volter, por favor tente ir mais devagar.
      </p>
      <div class="hero-btns">
        <a href="{% url 'home' %}" class="btn-secondary">Voltar ao Início →</a>
      </div>
    </div>

  </div>
</section>

{% endblock %}
